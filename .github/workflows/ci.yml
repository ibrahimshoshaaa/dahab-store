name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          TURSO_DATABASE_URL: file:./.ci-turso.db
          TURSO_AUTH_TOKEN: ci-placeholder
        run: npm run build
